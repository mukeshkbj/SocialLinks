<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}
html,body{width:1280px;height:720px;overflow:hidden;font-family:Inter,system-ui,sans-serif}
body{background:radial-gradient(900px 600px at 80% 20%,#0f5a4d 0%,#06221d 65%)}
.t{position:absolute;left:64px;bottom:56px;width:1100px;color:#fff}
.t img{position:absolute;left:0;top:-330px;width:96px;height:96px;border-radius:22px}
.t h1{font:800 104px/0.98 Inter;letter-spacing:-.035em;white-space:nowrap}
.t h1 em{font-style:normal;color:#3fd1b6}
.t p{margin-top:30px;font:600 30px/1.2 Inter;color:#bfe9df;white-space:nowrap}
.menu{position:absolute;left:640px;top:40px;width:300px;background:#fbfbfb;border-radius:12px;padding:8px;box-shadow:0 24px 60px -10px rgba(0,0,0,.6);font:500 22px Inter;color:#1c1f1e}
.mi{height:50px;display:flex;align-items:center;gap:12px;padding:0 14px;border-radius:8px}
.mi.hl{background:#e3e8e6}.mi img{width:22px;height:22px}.mi .ar{margin-left:auto;color:#6b7672}
.sep{height:1px;background:#e1e5e3;margin:6px 4px}
.sub{position:absolute;left:925px;top:205px;width:290px;background:#fbfbfb;border-radius:12px;padding:8px;box-shadow:0 24px 60px -10px rgba(0,0,0,.6);font:500 22px Inter;color:#1c1f1e}
.badge{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;color:#fff;font:700 12px Inter;flex:none}
.cur{position:absolute;left:1070px;top:242px;width:46px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.4))}
</style></head><body>
<div class="t"><img src="shots/icon.png" alt=""><h1>All your links.<br><em>One right-click.</em></h1><p>Free extension · Chrome · Edge · Firefox</p></div>
<div class="menu">
  <div class="mi">Cut</div><div class="mi">Copy</div><div class="mi">Paste</div><div class="sep"></div>
  <div class="mi hl"><img src="shots/icon.png" alt="">Social links<span class="ar">›</span></div><div class="sep"></div><div class="mi">Inspect</div></div>
<div class="sub">
  <div class="mi hl"><span class="badge" style="background:#0a66c2">in</span>LinkedIn<span class="ar">›</span></div>
  <div class="mi"><span class="badge" style="background:#24292f">GH</span>GitHub<span class="ar">›</span></div>
  <div class="mi"><span class="badge" style="background:#111">X</span>X (Twitter)<span class="ar">›</span></div>
  <div class="mi"><span class="badge" style="background:#55606b">+</span>Portfolio<span class="ar">›</span></div></div>
<svg class="cur" viewBox="0 0 24 34"><path d="M2 2 L2 27 L8.5 21 L13 31.5 L17.3 29.6 L12.9 19.3 L21.5 19.3 Z" fill="#fff" stroke="#111" stroke-width="1.8" stroke-linejoin="round"/></svg>
</body></html>
